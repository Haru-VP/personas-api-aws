service: users-serverless

frameworkVersion: '4'

custom:
  usersTableName: users-${sls:stage}
  emailIndexName: email-index

provider:
  name: aws
  region: us-east-2
  stage: ${opt:stage, 'dev'}
  architecture: arm64
  timeout: 10
  logRetentionInDays: 7
  environment:
    USERS_TABLE: ${self:custom.usersTableName}
    USERS_EMAIL_INDEX: ${self:custom.emailIndexName}
  tags:
    project: reto-aws
    service: users-serverless

package:
  individually: true
  patterns:
    - '!**'

functions:
  getUser:
    description: Gets a user by id from DynamoDB
    runtime: java21
    memorySize: 512
    snapStart: true
    role: GetUserRole
    handler: com.reto.aws.infrastructure.entrypoint.GetUserFunction::handleRequest
    package:
      artifact: users-java/target/users-java.jar
    events:
      - httpApi:
          method: GET
          path: /users/{id}

  createUser:
    description: Creates a user in DynamoDB validating a unique email
    runtime: java21
    memorySize: 512
    snapStart: true
    role: CreateUserRole
    handler: com.reto.aws.infrastructure.entrypoint.CreateUserFunction::handleRequest
    package:
      artifact: users-java/target/users-java.jar
    events:
      - httpApi:
          method: POST
          path: /users

  updateUser:
    description: Updates a user in DynamoDB validating a unique email
    runtime: nodejs24.x
    memorySize: 256
    role: UpdateUserRole
    handler: users-node/src/infrastructure/entrypoint/update-user-function.handler
    package:
      patterns:
        - users-node/package.json
        - users-node/src/**
    events:
      - httpApi:
          method: PUT
          path: /users/{id}

  deleteUser:
    description: Deletes a user by id from DynamoDB
    runtime: nodejs24.x
    memorySize: 256
    role: DeleteUserRole
    handler: users-node/src/infrastructure/entrypoint/delete-user-function.handler
    package:
      patterns:
        - users-node/package.json
        - users-node/src/**
    events:
      - httpApi:
          method: DELETE
          path: /users/{id}

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.usersTableName}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: ${self:custom.emailIndexName}
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: KEYS_ONLY
        ResourcePolicy:
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DenyDataAccessExceptUserLambdas
                Effect: Deny
                Principal: '*'
                Action:
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:PartiQLSelect
                  - dynamodb:PartiQLInsert
                  - dynamodb:PartiQLUpdate
                  - dynamodb:PartiQLDelete
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:custom.usersTableName}
                  - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:custom.usersTableName}/index/*
                Condition:
                  ArnNotEquals:
                    aws:PrincipalArn:
                      - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${self:service}-${sls:stage}-get-user
                      - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${self:service}-${sls:stage}-create-user
                      - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${self:service}-${sls:stage}-update-user
                      - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${self:service}-${sls:stage}-delete-user
        Tags:
          - Key: project
            Value: reto-aws
          - Key: service
            Value: users-serverless

    GetUserRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-get-user
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: get-user-policy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-getUser:*
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                  Resource:
                    Fn::GetAtt: [UsersTable, Arn]

    CreateUserRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-create-user
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: create-user-policy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-createUser:*
                - Effect: Allow
                  Action:
                    - dynamodb:PutItem
                  Resource:
                    Fn::GetAtt: [UsersTable, Arn]
                - Effect: Allow
                  Action:
                    - dynamodb:Query
                  Resource:
                    Fn::Sub: ${UsersTable.Arn}/index/${self:custom.emailIndexName}

    UpdateUserRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-update-user
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: update-user-policy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-updateUser:*
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                  Resource:
                    Fn::GetAtt: [UsersTable, Arn]
                - Effect: Allow
                  Action:
                    - dynamodb:Query
                  Resource:
                    Fn::Sub: ${UsersTable.Arn}/index/${self:custom.emailIndexName}

    DeleteUserRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-delete-user
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: delete-user-policy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${sls:stage}-deleteUser:*
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:DeleteItem
                  Resource:
                    Fn::GetAtt: [UsersTable, Arn]
